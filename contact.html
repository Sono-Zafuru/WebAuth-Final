        <header>
            <h1><a href="index.html">Solano Sayasetha</a></h1>

                <ul>
                    <li><a href="about.html" id="nav1">About Me</a><div id="link1"></div></li>
                    <li><a href="projects.html" id="nav2">Projects</a><div id="link2"></div></li>

            </nav>
            <div></div>

        <main>
            <h2>Contact Me</h2>
            <p>Get in touch with the form below</p>
            <form>
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="inName">Name*:</label><br>
                    <input type="text" id="inName" name="inName" placeholder="John Doe" required autofocus><br>
                    <label for="email">Enter your email:</label><br>
                    <input type="email" id="email" name="email" pattern="^.+@mail.broward.edu"><br>
                    <label for="phone">Enter your phone number (123-123-1234):</label><br>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="954-555-5555"><br>
                </fieldset>
                <fieldset>
                    <legend>Message</legend>
                    <label for="subject">Reason for Contact</label>
                    <select id="subject" name="subject">
                        <option value="work">Job Offer</option>
                        <option value="comm">Commission</option>
                        <option value="other">Other/Misc.</option>
                    </select><br>
                    <label for="miscOp">Other (Optional):</label>
                    <input type="text" id="miscOp" name="miscOp">
                    <br><br>
                    <label>Write your message below:</label><br>
                    <textarea name="message" rows="20" cols="80"></textarea>
                </fieldset>

                <input type="submit" value="Submit Form"> <input type="reset" value="Reset Form">
            </form>
        </main>

        <aside>
            <h3>Some Smooth Jazz</h3>
            <audio controls>
